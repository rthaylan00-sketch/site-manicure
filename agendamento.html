<!DOCTYPE html>
<html lang="pt-BR">

 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>By Luu Alves — Agendamento</title>
  <link rel="stylesheet" href="style.css" />
</head>

  <body>
    <header>
      <a href="index.html" id="voltar">← Voltar</a>
      <div id="logo-area">
       <h1>By Luu</h1>
       <h2>Alves</h2>
       <p>Nails Designer</p>
      </div>
    </header>

    <section id="formulario">
      <h2>Preencha seus dados</h2>
  
    <form id="form-agendamento">
     
      <div class="campo">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome"/>
      </div>

      <div class="campo">
       <label>Telefone</label>
       <input type="tel" id="telefone" placeholder="(11) 99999-9999"/>
      </div>
      <div class="campo">
        <label>Serviço</label>
        <select id="servico">
          <option value="">Selecione...</option>
          <option value="manicure">Manicure</option>
          <option value="alogamento">Alongamento</option>
        </select>
       </div>
      <div class="campo">
  <label>Data</label>
  <input type="text" id="data" placeholder="Ex: 18/03/2026" />
</div>

<div class="campo">
  <label>Horário</label>
  <input type="text" id="horario" placeholder="Ex: 14:00" />
</div>


      <button type="submit">Confirmar Agendamento</button>
    </form>
    </section>

    <footer>
      <p>Luiza Alves</p>
      <p>📲 (11) 99999-9999</p>
    </footer>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
       <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
       <script src="app.js"></script>
  </body>
</html>
