<!DOCTYPE html>
<html lang="pt-BR">

 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>By Luu Alves — Agendamento</title>
  <link rel="stylesheet" href="style.css" />
</head>

  <body>
    <header>
      <a href="index.html" id="voltar">← Voltar</a>
      <div id="logo-area">
       <h1>By Luu</h1>
       <h2>Alves</h2>
       <p>Nails Designer</p>
      </div>
    </header>

    <section id="formulario">
      <h2>Preencha seus dados</h2>
  
    <form id="form-agendamento">
     
      <div class="campo">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome"/>
      </div>

      <div class="campo">
       <label>Telefone</label>
       <input type="tel" id="telefone" placeholder="(11) 99999-9999"/>
      </div>
      <div class="campo">
        <label>Serviço</label>
        <select id="servico">
          <option value="">Selecione...</option>
          <option value="Alogamento na Tips - Aplicação R$145">Alongamento na Tips – Aplicação</option>
          <option value="Alogamento na Tips – Manutenção R$110">Alongamento na Tips – Manutenção</option>
          <option value="Banho em Gel R$100">Banho em Gel</option>
          <option value="Esmaltação em Gel R$85">Esmaltação em Gel</option>
        </select>
       <div id="infoServico"></div>
       
       </div>
     <div class="campo">
  <label>Data</label>
  <input type="date" id="data" />
</div>
      <div class="campo">
  <label>Horário</label>
  <select id="horario">
    <option value="">Selecione...</option>
    <option value="13:00">13:00</option>
    <option value="16:30">16:30</option>
    <option value="19:00">19:00</option>
    <option value="21:30">21:30</option>
  </select>


    </form>
     <button type="button" id="btnAgendar">
  Confirmar Agendamento
</button>

    </section>

      <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
      <script src="app.js"></script>
       
  </body>
</html>
