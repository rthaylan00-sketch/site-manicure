<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="admin.css">
<title>Painel Admin</title>
</head>
<body>

<header>
  <h1>LUU NAILS</h1>
  <p>📆 Agendamentos</p>
</header>

<div id="tela-senha" style="text-align:center; padding: 40px;">
  <h2>Digite a senha</h2>
  <input type="password" id="campo-senha" placeholder="Senha" 
    style="padding:10px; font-size:16px; border-radius:8px; border:1px solid #ccc;"/>
  <br><br>
  <button onclick="verificarSenha()" 
    style="padding:10px 24px; background:#b5475a; color:white; border:none; border-radius:8px; font-size:16px;">
    Entrar
  </button>
</div>

<div id="painel" style="display:none;">
  <div class="container">
    <div id="lista"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="admin.js"></script>

</body>
</html>
