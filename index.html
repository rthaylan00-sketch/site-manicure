<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>By Luu Alves</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <div id="tela-inicial">

      <div id="logo-area">
        <img src="logo.png" alt="By Luu Alves" id="logo" />
      </div>

      <div id="boas-vindas">
        <h1>Que bom você por aqui!</h1>
        <p>Agende seu horário e tenha unhas perfeitas!</p>
      </div>

      <div id="botoes">
        <a href="agendamento.html">
          <button class="btn-principal">Novo Agendamento</button>
        </a>
        <a href="#servicos">
          <button class="btn-secundario">Ver Serviços</button>
        </a>
      </div>

    </div>

    <section id="servicos">
      <h2>Nossos Serviços</h2>

      <div class="cards">
        <div class="card">
          <h3>💅 Manicure</h3>
          <p>Cuidado completo para as unhas das mãos.</p>
        </div>
        <div class="card">
          <h3>✨ Alongamento</h3>
          <p>Unhas longas e perfeitas do seu jeito.</p>
        </div>
      </div>
    </section>

    <footer>
      <p>By Luu Alves</p>
      <p>📱 11 999-9999</p>
    </footer>

  </body>
</html>
